kafka.heatmap.topic.count=1
kafka.heatmap.topic.prefix=heatmap-stat-app-
kafka.heatmap.topic.padding.length=2
kafka.heatmap.key.partition.count=1
# IMPORTANT: heatmapStatApp created before SUM(countOrOne) aggregation must be updated (see pinot-heatmap-stat-application-realtime-table.json)
# and forceCommitted before setting a non-zero value, otherwise aggregated counts are stored as 1 and the heatmap undercounts.
# 0 sends per span. Recommended 1000~10000, shorter is fresher and longer sends fewer messages (pinot slot is 10s so longer gains little).
kafka.heatmap.aggregation.interval-ms=0

# agent level heatmap is under development
kafka.heatmap.agent.enabled=false
kafka.heatmap.agent.topic=heatmap-stat
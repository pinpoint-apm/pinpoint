# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Frontend-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'

      - name: Install dependencies
        working-directory: ./web-frontend/src/main/v3
        run: yarn install --frozen-lockfile

      # The build only type-checks what the app imports, and the ui tests run through babel-jest,
      # which strips types. This is the only place test files are type-checked.
      - name: Type check
        working-directory: ./web-frontend/src/main/v3
        run: yarn typecheck

      # Package lint scripts are not part of the build; without this a style lint error only
      # shows up when someone builds the datetime-picker package itself.
      - name: Style lint
        working-directory: ./web-frontend/src/main/v3
        run: yarn workspace @pinpoint-fe/datetime-picker lint:style

      - name: Test
        working-directory: ./web-frontend/src/main/v3
        run: yarn test

      - name: Build
        working-directory: ./web-frontend/src/main/v3
        run: yarn build

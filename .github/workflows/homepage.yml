name: Homepage

on: 
  release:
    types: [published]

jobs:
  repository-dispatch-event:
    runs-on: ubuntu-24.04
    steps:
      - name: Repository Dispatch
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          gh api repos/pinpoint-apm/pinpoint-apm.github.io/dispatches --input - <<'PAYLOAD'
          {"event_type": "release-pinpoint", "client_payload": {"username": "${{ github.actor }}", "release": {"id": ${{ github.event.release.id }}}}}
          PAYLOAD

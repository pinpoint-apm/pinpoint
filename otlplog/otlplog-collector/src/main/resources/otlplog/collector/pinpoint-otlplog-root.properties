# OTLP Logs receiver - common defaults (profile-independent)
#
# The logs receiver is co-hosted in the OTLPTRACE collector process: LogsService/Export is served on
# the trace collector's gRPC servers (9998 plaintext / 9448 TLS) and POST /v1/logs on its servlet port
# (9997). Only LogRecords carrying exception.* attributes are kept and stored as Error Analysis
# records; everything else is counted and dropped.
#
# Module gate (NOT read from this file - it is evaluated before these sources are imported):
#   pinpoint.modules.collector.otlplog.enabled=true   (collector-starter application.yml / external config)
# It also needs the Error Analysis storage module in the same process:
#   pinpoint.modules.collector.exceptiontrace.enabled=true
#
# Transport limits shared with the trace service (same gRPC server; not configurable per signal):
#   collector.receiver.grpc.otlp.trace.inbound_message_size_max, concurrent-calls_per-connection_max,
#   flow-control_window_size_init, keepalive/idle settings.
# Profile-specific values (worker pool) live in profiles/<profile>/pinpoint-otlplog.properties.

# --- Selection ---
# Blacklist (comma-separated prefixes) for infrastructure noise: instrumentation scope names
# (e.g. "io.opentelemetry.exporter") or resolved application names. Empty by default. Matches are
# counted as record.dropped{reason=blacklisted} and are not reported back to the exporter.
pinpoint.collector.otlplog.filter.blacklist.scopes=
pinpoint.collector.otlplog.filter.blacklist.applications=

# Records whose trace flags say the trace was not sampled (sampled bit clear) have no span in storage
# to link to. false (default): drop, counted as record.dropped{reason=unsampled_context}.
# true: store anyway for the Error Analysis aggregates, counted as record.unsampled_context.
pinpoint.collector.otlplog.exception.store-unsampled=false

# --- Mapping ---
# Byte cap for exception.message (the Pinot errorMessage column). Falls back to the trace path's
# pinpoint.collector.otlptrace.exception.message-max-bytes so both signals are bounded alike.
# Stack trace depth / frame caps are the trace path's (parsing is shared).
pinpoint.collector.otlplog.exception.message-max-bytes=2048
# exception.type and http.route (uriTemplate) caps; uriTemplate is also sanitized (query string /
# fragment dropped, control characters removed). Same defaults as the trace path.
pinpoint.collector.otlplog.exception.type-max-bytes=1024
pinpoint.collector.otlplog.exception.uri-template-max-bytes=1024
# Stack trace input bounds (whole text / per line, before the regex parsers) are the trace path's:
# pinpoint.collector.otlptrace.exception.stacktrace.max-chars / .line-max-chars (parsing is shared).

# --- gRPC admission (LogsService) ---
# In-flight wire-byte ceiling for logs alone (Semaphore; UNAVAILABLE when exceeded), separate from the
# trace budget (256MB). 64MB: ~99% of records are dropped at the attribute key scan before any mapping,
# and a parsed request lives only while its task runs (~3x wire size), so this bounds logs heap at
# roughly 200MB.
pinpoint.collector.otlplog.admission.max-in-flight-bytes=67108864

# --- OTLP/HTTP (POST /v1/logs) admission - own filter instances with own budgets ---
# Per-request body cap: 413 when Content-Length exceeds it. 4MB = the SDK's default batch ceiling.
pinpoint.collector.otlplog.http.max-request-bytes=4194304
# gzip decompression cap (decompression-bomb guard; exceeding it -> 400). 16MB.
pinpoint.collector.otlplog.http.max-decompressed-request-bytes=16777216
# Concurrent in-flight HTTP log requests (503 + Retry-After when exceeded). Half the trace path's.
pinpoint.collector.otlplog.http.max-concurrent-requests=32
# In-flight byte ceiling for HTTP logs (503 + Retry-After when exceeded). 64MB, same sizing as gRPC.
pinpoint.collector.otlplog.http.admission.max-in-flight-bytes=67108864
# Retry-After (seconds) returned on 503 back-pressure.
pinpoint.collector.otlplog.http.rejected.retry-after-seconds=1

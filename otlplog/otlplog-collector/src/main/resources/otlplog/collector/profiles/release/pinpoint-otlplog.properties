# OTLP Logs receiver - release profile

# Worker executor: runs selection + mapping + store for LogsService/Export, off the gRPC handler
# thread (HTTP requests run on the servlet thread). Small on purpose: ~99% of records are dropped at
# the attribute key scan, so a task is cheap; the queue absorbs bursts. A full queue returns
# UNAVAILABLE (retryable) to the exporter. Each queued task retains one parsed request (<= inbound
# 4MB wire, ~3x parsed): 256 queued => ~3GB worst case, ~30MB at the measured ~40KB batches.
# Re-size from collector.otlplog.request.bytes (max) and record.received (rate) after rollout.
collector.receiver.grpc.otlp.log.worker.executor.corePoolSize=4
collector.receiver.grpc.otlp.log.worker.executor.maxPoolSize=4
collector.receiver.grpc.otlp.log.worker.executor.queueCapacity=256
collector.receiver.grpc.otlp.log.worker.executor.monitor-enable=true
collector.receiver.grpc.otlp.log.worker.executor.monitor.duration.enable=true

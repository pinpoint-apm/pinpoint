# OTLP Trace gRPC - common defaults (profile-independent)
#
# Separated from the collector's pinpoint-collector-grpc.properties so the OTLP trace
# receiver can be tuned independently of the agent/stat/span receivers.
# Profile-specific values (bind address, executor pool sizes) live in
# profiles/<profile>/pinpoint-otlptrace-grpc.properties.

collector.receiver.grpc.monitor.enable=true

# --- Server Option (transport) ---
collector.receiver.grpc.otlp.trace.keepalive_time_millis=30000
collector.receiver.grpc.otlp.trace.keepalive_timeout_millis=60000
# OTLP exporters often send keepalive PINGs during idle (no active RPC). Permit them and
# relax the min interval to 10s so the server does not GOAWAY("too_many_pings").
collector.receiver.grpc.otlp.trace.permit_keepalive_time_millis=10000
collector.receiver.grpc.otlp.trace.permit_keepalive_without_calls=true
# OTLP exporters keep low-frequency connections open; use a long idle (6m) to avoid frequent
# reconnects. (ServerOption default is only 10s.)
collector.receiver.grpc.otlp.trace.connection_idle_timeout_millis=360000
collector.receiver.grpc.otlp.trace.max_connection_age=3h
collector.receiver.grpc.otlp.trace.max_connection_age_grace_millis=10000
collector.receiver.grpc.otlp.trace.handshake_timeout_millis=120000
# 8KB (not 2KB): OTLP exporters carry header-based auth (Authorization: Bearer <JWT>, API keys).
# A token + standard gRPC headers (+32B HPACK overhead each) can exceed 2KB and the call would be
# rejected before the handler. Header buffer cost is negligible (~8KB x concurrent streams).
collector.receiver.grpc.otlp.trace.header_list_size_max=8KB
collector.receiver.grpc.otlp.trace.receive_buffer_size=64KB
collector.receiver.grpc.otlp.trace.grpc_max_term_wait_time_millis=3000
## AUTO, NIO, EPOLL
collector.receiver.grpc.otlp.trace.channel-type=AUTO

# --- Flow control / message size (rate protection) ---
# Bound concurrent calls per connection (ServerOption default is unlimited) and cap inbound
# message size so a single OTLP exporter cannot overwhelm the receiver.
# inbound is 4MB (was 1MB) to match the reference OTel Collector's 4MiB default and the HTTP path's
# max-request-bytes: a batch over the limit is rejected with RESOURCE_EXHAUSTED, which OTLP treats as
# terminal (no RetryInfo), so the exporter drops it permanently — 1MB was too small for typical batches.
# Memory (~8GB server): each in-flight call buffers up to inbound_message_size_max of wire bytes (direct
# memory), so 128 concurrent calls => up to ~512MB/connection worst case (was ~128MB at 1MB). This is the
# adversarial ceiling (128 simultaneous max-size uploads on one connection); a normal exporter keeps only
# a few streams in flight. It assumes a modest connection count — set -XX:MaxDirectMemorySize explicitly
# rather than relying on it defaulting to -Xmx. The heap-side processing bound is unchanged
# (admission.max-in-flight-bytes below).
collector.receiver.grpc.otlp.trace.concurrent-calls_per-connection_max=128
collector.receiver.grpc.otlp.trace.flow-control_window_size_init=512KB
collector.receiver.grpc.otlp.trace.inbound_message_size_max=4MB

# --- Mapping truncation / memory protection (non-gRPC, prefix: pinpoint.collector.otlptrace.*) ---
# Co-located here (not in the shared pinpoint-collector*.properties) so all otlptrace receiver
# tuning lives in one otlptrace-owned file. These mirror the @Value defaults in the mappers.
# Per-leaf UTF-8 byte caps for over-long values; truncation is summarized once per span via the
# OPENTELEMETRY_TRUNCATED annotation. SQL is stored inline per span (no metadata-table dedup like
# the native agent), so it is capped at the same 8KB as attributes to bound HBase row size.
pinpoint.collector.otlptrace.attribute.value-max-bytes=8192
pinpoint.collector.otlptrace.sql.max-bytes=8192
pinpoint.collector.otlptrace.event.value-max-bytes=8192
pinpoint.collector.otlptrace.link.value-max-bytes=8192
# Exception-trace field caps. Unlike attributes above these are not span annotations; truncation is
# surfaced via the collector.otlptrace.exception.truncated meter (tag field=message|stacktrace_depth|
# frame_value). max-depth is the parsed stacktrace frame count (OTel sends one flattened string, so the
# unbounded axis is frame count, not the native exception-chain depth); <= 0 means unlimited.
# message-max-bytes is aligned with the native agent's errormessage cap
# (profiler.exceptiontrace.errormessage.max=2048) so both sources bound the Pinot errorMessage
# column alike (the agent caps chars; bytes are stricter for multi-byte text, identical for ASCII).
pinpoint.collector.otlptrace.exception.message-max-bytes=2048
# exception.type is the Error Analysis grouping key and the Pinot errorClassName column; a third-party
# exporter can send anything, so cap it (deterministic truncation keeps equal types equal).
pinpoint.collector.otlptrace.exception.type-max-bytes=1024
# uriTemplate (http.route) cap; the value is also sanitized (query string / fragment dropped, control
# characters removed) since a buggy SDK may send a raw URL carrying tokens. Counted as field=uri_template.
pinpoint.collector.otlptrace.exception.uri-template-max-bytes=1024
pinpoint.collector.otlptrace.exception.stacktrace.max-depth=256
pinpoint.collector.otlptrace.exception.stacktrace.frame-max-bytes=2048
# Input bounds applied to the flattened stacktrace BEFORE the regex-based language parsers see it
# (shared by the span-event and the log-record paths). The parsers are quadratic in the length of a
# single line in their worst case (a very long line with no closing bracket): one 4MB line would pin
# a worker thread for hours. Whole text is cut at max-chars (at the last line break), every line at
# line-max-chars; <= 0 means unlimited. Real stacks are ~10KB / <1KB per line, so the defaults are
# far above normal traffic. Counted as field=stacktrace_bytes / stacktrace_line.
pinpoint.collector.otlptrace.exception.stacktrace.max-chars=262144
pinpoint.collector.otlptrace.exception.stacktrace.line-max-chars=4096
# Global in-flight wire-byte ceiling (Semaphore admission). Bounds heap regardless of connection
# count; export() reserves getSerializedSize() and returns UNAVAILABLE when exceeded. 256MB (8GB server).
pinpoint.collector.otlptrace.admission.max-in-flight-bytes=268435456

# --- OTLP/HTTP (POST /v1/traces) admission — servlet counterpart of the gRPC safeguards above,
# enforced in OtlpTraceHttpAdmissionFilter *before* the protobuf body is materialized. Sized for an
# ~8GB server. Kept as a separate (HTTP-only) budget for now; may be unified with the gRPC budget later.
# Per-request body cap: 413 when Content-Length exceeds it (unknown-length bodies bounded by a
# limiting stream -> 400). 4MB. Note: OTLP/JSON bodies are several times larger than the same spans
# in protobuf — raise this (and the decompression cap below) if JSON exporters hit 413.
pinpoint.collector.otlptrace.http.max-request-bytes=4194304
# Global in-flight byte ceiling for HTTP (Semaphore). 256MB (~3% of an 8GB heap); 503 + Retry-After
# when exceeded. At 4MB/request this admits up to ~64 max-size requests concurrently.
pinpoint.collector.otlptrace.http.admission.max-in-flight-bytes=268435456
# Concurrent in-flight HTTP requests (503 + Retry-After when exceeded); mirrors the gRPC
# concurrent-calls_per-connection_max above.
pinpoint.collector.otlptrace.http.max-concurrent-requests=64
# Retry-After (seconds) returned on 503 backpressure.
pinpoint.collector.otlptrace.http.rejected.retry-after-seconds=1
# gzip decompression cap (OtlpTraceDecompressionFilter). Content-Length bounds only the compressed
# size, so the inflated body is capped here to guard against decompression bombs; exceeding it -> 400.
# 16MB = ~4x max-request-bytes headroom for gzip'd protobuf. Worst-case inflated heap is
# max-concurrent-requests * this value, so raise both together. Unsupported encodings -> 415.
pinpoint.collector.otlptrace.http.max-decompressed-request-bytes=16777216

# --- TLS (in-app) ---
# Activated by pinpoint.modules.collector.grpc.otlptrace.ssl.enabled=true (default off).
# When enabled, a TLS listener binds the address below and uses the cert/key from
# collector.receiver.grpc.ssl.* (key paths left empty here; set them per deployment).
collector.receiver.grpc.otlp.trace.ssl.bindaddress.ip=0.0.0.0
collector.receiver.grpc.otlp.trace.ssl.bindaddress.port=9448
collector.receiver.grpc.ssl.provider_type=jdk
collector.receiver.grpc.ssl.key_file_path=
collector.receiver.grpc.ssl.key_cert_file_path=

# --- Link index (calls without a Pinpoint parent application) ---
# When an OTel caller cannot propagate the Pinpoint parent application, the callee's server span has
# no parentApplication and the server map cannot draw caller -> callee. With this enabled, the
# collector writes the callee's SERVER span (parentSpanId) and the caller's RPC CLIENT span event
# (its span id) to a Redis-compatible store, and the batch job otlpLinkJoinJob matches them per
# one-minute slot and writes the server-map rows. Default off.
pinpoint.collector.otlptrace.link-index.enabled=false
# Store connection: cluster or standalone, comma separated host:port. Ignored when a
# LinkIndexRedisConnectorFactory bean is provided.
pinpoint.collector.otlptrace.link-index.redis.mode=cluster
pinpoint.collector.otlptrace.link-index.redis.nodes=
pinpoint.collector.otlptrace.link-index.redis.password=
pinpoint.collector.otlptrace.link-index.redis.connect-timeout=3s
pinpoint.collector.otlptrace.link-index.redis.command-timeout=2s
# Hash keys per slot. Must be the same value in the collectors and the batch job. Keep entries per
# bucket at or below the store's hash-max-ziplist-entries (512) so hashes stay compactly encoded.
pinpoint.collector.otlptrace.link-index.buckets=65536
# Keys expire at (slot end + ttl + bucket mod 60 s): spread over a minute instead of all at once.
# Also bounds the store memory when the batch job stops.
pinpoint.collector.otlptrace.link-index.ttl=5m
# Bounded write queue; entries are dropped (and counted) when it is full, never blocking ingest.
pinpoint.collector.otlptrace.link-index.queue-size=100000
# Per-collector cap of entries per one-minute slot (store memory guard).
pinpoint.collector.otlptrace.link-index.max-entries-per-slot=1000000
# Share (1..100 %) of max-entries-per-slot one CLIENT identifier (application + destination) may use per slot and
# collector, so that one flooding caller cannot crowd out the entries of the others; checked before the slot cap.
# 100 = no per-identifier limit. Keep (max-entries-per-slot x percent / 100) x collectors at or above the batch job's
# job.otlp.link-join.suppress.min-unmatched-per-slot, or a flooding identifier is never suppressed.
# Note that the share applies even while the slot quota has room: with the defaults a single legitimate identifier
# above 200,000 calls per minute and collector is cut. Both limits are first come first served within the minute,
# not a uniform sample: when they are reached, the later part of the minute is under-represented in the server map
# counts. Watch dropped{reason=identifier_limit|slot_limit}, quota.limited.identifiers and the INFO lines of the slot
# summary to know when the counts of a slot are incomplete. Once 10,000 identifiers are tracked in a slot, the further
# ones share one pooled share per kind (quota.untracked, quota.tracked.identifiers).
pinpoint.collector.otlptrace.link-index.max-entries-per-identifier-percent=20
# Same for the SERVER entries of one application. Off by default: a callee with many callers is a normal hub.
pinpoint.collector.otlptrace.link-index.max-server-entries-per-application-percent=100
# Index only 1/N of the traces (by traceId) and let the batch job scale the counts by N. 1 = all.
# Must be the same value in the collectors and the batch job.
pinpoint.collector.otlptrace.link-index.sample-modulo=1
# Suppression list: CLIENT identifiers (application + destination) whose calls the batch job found unmatched for a
# day (job.otlp.link-join.suppress.*) are not indexed any more, apart from probe-per-slot entries per slot and
# collector so that a callee that starts reporting is matched and released at once. Applied after the trace
# sampling (sample-modulo), so the probe allowance is spent on entries that would be written; the probed
# counter is that allowance, not the entries the store accepted. The list lives in the store and is read every
# refresh; nothing is suppressed until the first read, or when the store cannot be read.
pinpoint.collector.otlptrace.link-index.suppress.enabled=true
pinpoint.collector.otlptrace.link-index.suppress.refresh=60s
pinpoint.collector.otlptrace.link-index.suppress.probe-per-slot=100
# Probes by trace id: in addition to the first probe-per-slot entries, every entry of a suppressed identifier whose
# trace id is sampled by this modulo (1 in N, the same hash as sample-modulo) is written. The decision depends on
# the trace id alone, so the CLIENT and the SERVER side of one call take it alike on any collector: when both
# identifiers of a call relation are suppressed, these are the pairs that can still match and release them. Cost is
# 1/N of the suppressed entries. 0 or 1 turns them off.
pinpoint.collector.otlptrace.link-index.suppress.probe-modulo=1000
# SERVER identifiers: the SERVER entries of one application are identified together with the class of their parent
# span, "root" when the parent span id is the low 8 bytes of the trace id (a B3 / Jaeger root span: the caller made the
# call without a client span that could be indexed, so the entry can never match) or "other". The join job tracks them
# like the CLIENT identifiers, so a callee whose external callers never match is suppressed while its matching callers
# are kept. false: every SERVER entry is indexed, whatever the list says.
pinpoint.collector.otlptrace.link-index.suppress.server.enabled=true
# Static rules, comma separated: "application|destination" (one CLIENT identifier), "application" (all of its CLIENT
# and SERVER entries), "server:application|root" / "server:application|other" (one SERVER identifier) or
# "server:application" (all of its SERVER entries; an application name cannot contain ':'). force: suppressed at
# once, without the list (probes still written). pin: never suppressed.
pinpoint.collector.otlptrace.link-index.suppress.force=
pinpoint.collector.otlptrace.link-index.suppress.pin=

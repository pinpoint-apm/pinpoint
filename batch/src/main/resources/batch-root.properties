batch.server.env=release

#smtp config
spring.mail.pinpoint-url=
spring.mail.host=
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.port=587
#  https://javaee.github.io/javamail/docs/api/com/sun/mail/smtp/package-summary.html
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.from=pinpoint_operator@pinpoint-.com
spring.mail.properties.mail.smtp.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=false


# webhook config
webhook.enable=false

###########################################################
# batch job config                                        #
###########################################################

job.alarm.cron=0 0/3 * * * *
job.alarm.agent.inspector.stat.table.count=1
job.alarm.agent.inspector.stat.table.prefix=inspectorStatAgent
job.alarm.agent.inspector.stat.table.padding.length=2

job.agent.count.cron=0 0 2 * * *

job.alarm.uristat.enable=false
job.alarm.uristat.cron=0 2/3 * * * *

job.cleanup.inactive.agents.duration.days=30

#alarm config
alarm.collector.version=2

# new cleanup job for Application and AgentId table
job.cleanup.inactive.agent-application.enable=false
job.cleanup.inactive.agent-application.cron=0 0 4 * * THU
job.cleanup.inactive.agent-application.dry-run=true
job.cleanup.inactive.agent-application.threshold-days=30
# Experimental feature
# applications exceeding the threshold apply additional retention reduction
job.cleanup.inactive.agent-application.agent-count-threshold=2147483647
job.cleanup.inactive.agent-application.grace-days=7

# Service registry cache
web.service.registry.cache.initialCapacity=16
web.service.registry.cache.maximumSize=20000
web.service.registry.cache.expireAfterWrite=1h
web.service.registry.cache.load.warmup.enabled=false
web.service.registry.cache.load.refresh.enabled=false

# OTLP link join: matches the OTel calls whose callee did not receive the Pinpoint parent application,
# from the link index written by the OTLP trace collectors (pinpoint.collector.otlptrace.link-index.*),
# and writes the server-map rows. Runs every minute for the slots that have ended. Default off.
job.otlp.link-join.enable=false
job.otlp.link-join.cron=30 * * * * *
# Store connection: cluster or standalone, comma separated host:port. Ignored when a
# LinkIndexRedisConnectorFactory bean is provided.
job.otlp.link-join.redis.mode=cluster
job.otlp.link-join.redis.nodes=
job.otlp.link-join.redis.password=
job.otlp.link-join.redis.connect-timeout=3s
job.otlp.link-join.redis.command-timeout=10s
# Must be the same as the collectors' pinpoint.collector.otlptrace.link-index.buckets / sample-modulo / ttl.
job.otlp.link-join.buckets=65536
job.otlp.link-join.sample-modulo=1
job.otlp.link-join.ttl=5m
job.otlp.link-join.threads=8
# Buckets read per round trip per thread: at most threads x chunk-buckets x 2 HGETALL replies are in flight,
# kept small so a pause of the job does not grow the store's output buffers (nbase-arc guide).
job.otlp.link-join.chunk-buckets=16
# A slot with a bucket above this many entries is logged as a warning: raise buckets (collectors and job together).
job.otlp.link-join.bucket-warn-entries=512
# Must be the same as the collectors' collector.map-link.avg.enable / max.enable.
job.otlp.link-join.map-link.avg.enable=true
job.otlp.link-join.map-link.max.enable=true
# Metrics (Micrometer, when a MeterRegistry exists): batch.otlp.linkjoin.{entries,pairs,links,rows,unmatched,
# dropped{side},deleted.keys,skipped.slots,failed.launches} counters and {max.bucket.entries,oversized.buckets,
# last.done.slot.age.seconds} gauges; job/step timers are Spring Batch's spring.batch.job / spring.batch.step.

###########################################################
# BANNER                                                  #
###########################################################
# Pinpoint Banner Settings
# Pinpoint banner mode : OFF, CONSOLE, LOG
pinpoint.banner.mode=console
pinpoint.banner.configs=batch.server.env,\
                        spring.mail.pinpoint-url,\
                        spring.mail.host,\
                        spring.datasource.hikari.jdbc-url,\
                        spring.meta-datasource.hikari.jdbc-url,\
                        spring.pinot-datasource.pinot.jdbc-url,\
                        pinpoint.zookeeper.address,\
                        hbase.client.host,\
                        hbase.client.port,\
                        hbase.client.znode,\
                        hbase.namespace,\
                        job.alarm.enable,\
                        job.alarm.cron,\
                        job.alarm.uristat.enable,\
                        job.alarm.uristat.cron,\
                        job.agent.count.enable,\
                        job.agent.count.cron,\
                        job.cleanup.inactive.agent-application.enable,\
                        job.cleanup.inactive.agent-application.dry-run,\
                        job.cleanup.inactive.agent-application.cron,\
                        job.cleanup.inactive.agent-application.threshold-days,\
                        job.otlp.link-join.enable,\
                        job.otlp.link-join.cron,\
                        job.otlp.link-join.redis.nodes
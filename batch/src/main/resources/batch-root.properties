batch.server.env=release

#smtp config
spring.mail.pinpoint-url=
spring.mail.host=
spring.mail.username=
spring.mail.password=
spring.mail.protocol=smtp
spring.mail.port=587
#  https://javaee.github.io/javamail/docs/api/com/sun/mail/smtp/package-summary.html
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.from=pinpoint_operator@pinpoint-.com
spring.mail.properties.mail.smtp.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=false


# webhook config
webhook.enable=false

###########################################################
# batch job config                                        #
###########################################################

job.alarm.cron=0 0/3 * * * *
job.alarm.agent.inspector.stat.table.count=1
job.alarm.agent.inspector.stat.table.prefix=inspectorStatAgent
job.alarm.agent.inspector.stat.table.padding.length=2

job.agent.count.cron=0 0 2 * * *
job.agent.count.all-services.enable=true
job.agent.count.service-list.limit=20000

job.alarm.uristat.enable=false
job.alarm.uristat.cron=0 2/3 * * * *

job.cleanup.inactive.agents.duration.days=30

#alarm config
alarm.collector.version=2

# new cleanup job for Application and AgentId table
job.cleanup.inactive.agent-application.enable=false
job.cleanup.inactive.agent-application.cron=0 0 4 * * THU
job.cleanup.inactive.agent-application.dry-run=true
job.cleanup.inactive.agent-application.threshold-days=30
# Experimental feature
# applications exceeding the threshold apply additional retention reduction
job.cleanup.inactive.agent-application.agent-count-threshold=2147483647
job.cleanup.inactive.agent-application.grace-days=7

# Spring Batch meta data cleanup (batchMetaCleanupJob): deletes the BATCH_* rows of the meta data source for
# job instances older than the retention. Spring Batch keeps every execution forever and offers no purge;
# pinpoint jobs never restart (schedule.date is an identifying parameter), so old rows have only audit value.
# Default off, and dry-run (counts, deletes nothing) until job.cleanup.batch-meta.dry-run=false.
job.cleanup.batch-meta.enable=false
job.cleanup.batch-meta.cron=0 30 4 * * *
job.cleanup.batch-meta.dry-run=true
# Default retention. Per job: job.cleanup.batch-meta.retention-by-job.<jobName>=<duration>, e.g.
# job.cleanup.batch-meta.retention-by-job.otlpLinkJoinJob=1d. Minimum 1h. The retention of otlpLinkJoinJob must also
# be at least job.otlp.link-join.ttl (its launcher revisits the slots of the last ttl through their meta data);
# the batch fails to start otherwise.
job.cleanup.batch-meta.retention=30d
# Jobs whose meta data may be deleted (comma separated). Empty = the jobs registered in this application;
# jobs of other applications sharing the meta tables are left alone unless listed here.
job.cleanup.batch-meta.job-names=
# Instances deleted per run at most (one JobRepository.deleteJobInstance per instance, 8-11 statements each);
# must exceed the daily number of job instances or the backlog grows.
job.cleanup.batch-meta.max-instances-per-run=50000
# Executions read per query while scanning BATCH_JOB_EXECUTION in id order (100-10000).
job.cleanup.batch-meta.page-size=1000

# Service registry cache
web.service.registry.cache.initialCapacity=16
web.service.registry.cache.maximumSize=20000
web.service.registry.cache.expireAfterWrite=1h
web.service.registry.cache.load.warmup.enabled=false
web.service.registry.cache.load.refresh.enabled=false

# OTLP link join: matches the OTel calls whose callee did not receive the Pinpoint parent application,
# from the link index written by the OTLP trace collectors (pinpoint.collector.otlptrace.link-index.*),
# and writes the server-map rows. Runs every minute for the slots that have ended. Default off.
job.otlp.link-join.enable=false
job.otlp.link-join.cron=30 * * * * *
# Store connection: cluster or standalone, comma separated host:port. Ignored when a
# LinkIndexRedisConnectorFactory bean is provided.
job.otlp.link-join.redis.mode=cluster
job.otlp.link-join.redis.nodes=
job.otlp.link-join.redis.password=
job.otlp.link-join.redis.connect-timeout=3s
job.otlp.link-join.redis.command-timeout=10s
# Must be the same as the collectors' pinpoint.collector.otlptrace.link-index.buckets / sample-modulo / ttl.
job.otlp.link-join.buckets=65536
job.otlp.link-join.sample-modulo=1
job.otlp.link-join.ttl=5m
job.otlp.link-join.threads=8
# Buckets read per round trip per thread: at most threads x chunk-buckets x 2 HGETALL replies are in flight,
# kept small so a pause of the job does not grow the store's output buffers (nbase-arc guide).
job.otlp.link-join.chunk-buckets=16
# A slot with a bucket above this many entries is logged as a warning: raise buckets (collectors and job together).
job.otlp.link-join.bucket-warn-entries=512
# Must be the same as the collectors' collector.map-link.avg.enable / max.enable.
job.otlp.link-join.map-link.avg.enable=true
job.otlp.link-join.map-link.max.enable=true
# Suppression list (pinpoint.collector.otlptrace.link-index.suppress.* on the collectors): after the join of each
# slot, the identifiers whose calls never match are tracked in the store (CLIENT: application + destination; SERVER:
# application + parent span class, "root" when the parent span id is the low 8 bytes of the trace id as with a B3 /
# Jaeger root span, "other" otherwise); one that has been unmatched for activate-after AND in at least activate-slots
# slots becomes ACTIVE and the collectors stop indexing it, apart from a probe per slot. One matched call releases an
# identifier at once. Only identifiers with min-unmatched-per-slot unmatched calls in a slot are tracked; identifiers
# unseen for idle-ttl are forgotten and the list is capped at max-keys. A failed update is logged and counted, never
# fails the job.
# min-unmatched-per-slot must stay within what the collectors write for one identifier per slot: their
# max-entries-per-slot x max-entries-per-identifier-percent / 100, times the number of collectors.
job.otlp.link-join.suppress.enabled=true
job.otlp.link-join.suppress.activate-after=24h
job.otlp.link-join.suppress.activate-slots=1440
job.otlp.link-join.suppress.min-unmatched-per-slot=100
job.otlp.link-join.suppress.idle-ttl=7d
job.otlp.link-join.suppress.max-keys=1000
# false: SERVER identifiers are kept out of the list (CLIENT identifiers only, as before 4.0.0): their join outcome is
# ignored and the SERVER identifiers already in the list are removed at the next run.
job.otlp.link-join.suppress.server.enabled=true
# Metrics (Micrometer, when a MeterRegistry exists): batch.otlp.linkjoin.{entries,pairs,links,rows,unmatched,
# dropped{side},deleted.keys,skipped.slots,failed.launches} counters and {max.bucket.entries,oversized.buckets,
# last.done.slot.age.seconds} gauges; batch.otlp.linkjoin.suppress.{activated,released,expired}{kind} and errors
# counters and {candidates,active,candidates.server,active.server} gauges; job/step timers are Spring Batch's
# spring.batch.job / spring.batch.step.

# alarm v2 history and the sent or dead outbox rows of it
job.cleanup.alarm.history.enable=false
job.cleanup.alarm.history.cron=0 30 3 * * *
job.cleanup.alarm.history.expiration-days=14
job.cleanup.alarm.history.chunk-size=5000


###########################################################
# alarm evaluation                                        #
###########################################################

# Fixed delay, so a sweep that runs long does not have the next one start on top of it.
pinpoint.modules.batch.alarm.fixedDelayMs=10000
# How many due rules one sweep reads at a time. A full batch continues into another read.
pinpoint.modules.batch.alarm.batchSize=300
pinpoint.modules.batch.alarm.worker.coreSize=4
pinpoint.modules.batch.alarm.worker.maxSize=4

###########################################################
# notification outbox                                     #
###########################################################

pinpoint.modules.batch.alarm.outbox.fixedDelayMs=5000
pinpoint.modules.batch.alarm.outbox.batchSize=100
pinpoint.modules.batch.alarm.outbox.maxAttempts=5
pinpoint.modules.batch.alarm.outbox.leaseSec=60

###########################################################
# senders                                                 #
###########################################################

# No sender is configured by default. Email is declared only once a From address is set, and
# no SMS sender ships at all -- a gateway is bought rather than installed, so the module that
# has one contributes it. A channel with no sender for its method type is recorded against the
# alarm's history where the rule's owner can see it, and the rule's other channels still go out.
alarm.email.sender=

###########################################################
# agent stat tables                                       #
###########################################################

# How the agent stat samples are laid out in pinot is deliberately not defaulted here. It is a
# property of the installation that collected them, it has to match what the collector was
# configured to write, and a wrong value is silent: the process reads one table out of however
# many exist and the rules for every application that hashes elsewhere simply never fire.
# Set these in the profile file or in the external configuration file:
#   alarm.agent-stat.table.prefix
#   alarm.agent-stat.table.padding-length
#   alarm.agent-stat.table.count

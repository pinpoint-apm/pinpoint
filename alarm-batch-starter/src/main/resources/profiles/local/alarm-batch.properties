# Set per installation. The defaults in alarm-batch-root.properties apply to whatever is
# left out here, and anything set here is in turn overridden by the file named by
# -Dpinpoint.alarm.batch.config.location.

# A single table, which is what a local collector writes to.
alarm.agent-stat.table.prefix=inspectorStatAgent
alarm.agent-stat.table.padding-length=2
alarm.agent-stat.table.count=1
